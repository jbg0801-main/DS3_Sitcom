[sitcom]
enabled=true
log=true
poll_hz=20
; Multiplier on top of the in-game Sound Effect slider (0.0–1.0).
; Final loudness ≈ volume × (SFX_slider / 10).
volume=0.7

[events]
laugh_on_hit=true
laugh_on_death=true
cheer_on_boss_bar=true
applause_on_boss_death=true
wipe_on_area_title=true
ooh_on_item_get=true
; Fail laughs (CurrentAnim TAE). Turn off individually if noisy.
laugh_on_empty_flask=true
laugh_on_locked_door=true
laugh_on_no_spell=true
laugh_on_ladder_fall=true

[cooldowns]
laugh_hit_seconds=1.5
ooh_cooldown_seconds=0.75

[paths]
sounds_dir=sounds

[debug]
; Log MenuMan flags / area transitions (set false once calibrated).
probe_transitions=true

[chainload]
; Comma-separated DLL names next to dinput8.dll (also see sitcom/chainload.txt).
dlls=
